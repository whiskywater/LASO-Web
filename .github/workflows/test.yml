name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format, vet, test, and build Go application
        run: |
          test -z "$(gofmt -l main.go internal/web/*.go)"
          go vet ./...
          go test ./...
          go test -race ./...
          go build -trimpath ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser UI logic
        run: |
          node --check static/model.js
          node --check static/app.js
          node --check static/capabilities.js
          node --check static/sessions.js
          node --check static/session-model.js
          node --check static/session.js
          npm test
